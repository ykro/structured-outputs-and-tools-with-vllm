[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-outputs-and-tools-with-vllm"
version = "0.1.0"
description = "Structured outputs and tool calling with vLLM and Gemma: JSON Schema, choice, regex, a tool loop and streaming JSON"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Adrián Catalán"}]
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools]
packages = ["vllm_lab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["N999", "E402"]
